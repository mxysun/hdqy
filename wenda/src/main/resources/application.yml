spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:6033/wenda?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 2MB

jpa:
  properties:
    hibernate:
      hbm2ddl:
        auto: update
  show-sql: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: top.xym.springboot.wenda.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.web: DEBUG
